# Recomputes zebricky.json (IMDb charts for MK Cinema) once a month from IMDb's datasets.
name: Žebříčky IMDb

on:
  schedule:
    - cron: "0 4 2 * *"  # 2nd day of every month, 04:00 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/zebricky.yml"
      - "tools/make_charts.py"

permissions:
  contents: write

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spočítat žebříčky
        run: python tools/make_charts.py zebricky.json imdb-data
      - name: Uložit do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zebricky.json
          if git diff --cached --quiet; then
            echo "Žebříčky se nezměnily."
          else
            git commit -m "Žebříčky IMDb: aktualizace $(date +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
